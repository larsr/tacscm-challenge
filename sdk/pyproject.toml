[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tac-scm-sdk"
version = "0.5.0"
description = "Python SDK for TAC SCM 2026 agents (tac-scm-message/2), with three baseline policies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
baseline-random = "tac_scm_baselines.agent_main:random_main"
baseline-heuristic = "tac_scm_baselines.agent_main:heuristic_main"
baseline-optimizer = "tac_scm_baselines.agent_main:optimizer_main"

[tool.setuptools]
packages = ["tac_scm_sdk", "tac_scm_baselines"]

[tool.setuptools.package-data]
tac_scm_sdk = ["py.typed"]
