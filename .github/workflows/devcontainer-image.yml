name: devcontainer image

on:
  push:
    branches: [main]
    paths: [".devcontainer/**", ".github/workflows/devcontainer-image.yml", "haskell-agent"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The image's Haskell tools come from the haskell-agent submodule; a private one needs a token that can read it.
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-devcontainer:latest
            ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
