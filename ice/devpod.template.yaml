# Dev pod: the .devcontainer image with the repo cloned into a folder of an existing volume.
# Rendered by ice/devpod.sh; ${DEVPOD_*} come from .env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEVPOD_NAME}
  labels:
    app: ${DEVPOD_NAME}
spec:
  replicas: 1
  strategy:
    type: Recreate  # the volume is ReadWriteOnce
  selector:
    matchLabels:
      app: ${DEVPOD_NAME}
  template:
    metadata:
      labels:
        app: ${DEVPOD_NAME}
    spec:
      imagePullSecrets:
        - name: ${DEVPOD_PULL_SECRET}
      # No fsGroup: it would re-own the whole shared volume. Only our folder is chowned.
      initContainers:
        - name: workspace-owner
          image: ${DEVPOD_IMAGE}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
          resources:  # the namespace quota requires these on every container
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
          command: [sh, -c, "mkdir -p /disk/${DEVPOD_SUBPATH} && chown 1000:1000 /disk/${DEVPOD_SUBPATH}"]
          volumeMounts:
            - name: disk
              mountPath: /disk
      containers:
        - name: dev
          image: ${DEVPOD_IMAGE}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          workingDir: /workspaces/tacscm-challenge
          env:
            - name: REPO_URL
              value: ${DEVPOD_REPO_URL}
          command: [bash, -c]
          args:
            - |
              repo=/workspaces/tacscm-challenge
              [ -d "$repo/.git" ] || git clone "$REPO_URL" "$repo"
              cd "$repo" && .devcontainer/setup.sh && touch /tmp/ready
              exec sleep infinity
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 10
          resources:
            requests:
              cpu: "${DEVPOD_CPU}"
              memory: ${DEVPOD_MEMORY}
            limits:
              cpu: "${DEVPOD_CPU}"
              memory: ${DEVPOD_MEMORY}
          volumeMounts:
            - name: disk
              mountPath: /workspaces/tacscm-challenge
              subPath: ${DEVPOD_SUBPATH}
      volumes:
        - name: disk
          persistentVolumeClaim:
            claimName: ${DEVPOD_PVC}
