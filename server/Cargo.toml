[workspace]
members = ["crates/engine-core", "crates/game-runner"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "allow"

[profile.test]
opt-level = 2
